<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AUBRION — Управление машиной</title>
<style>
  :root{ --red:#ED1C24; --red2:#ff3b43; --bg:#070708; --card:#121316; --card2:#17191d;
         --line:#2a1416; --txt:#f2f4f7; --mut:#8a8f98; --ok:#35d07f; --off:#d94b4b; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0; background:
        radial-gradient(120% 60% at 50% -10%, #1a0608 0%, var(--bg) 55%) no-repeat, var(--bg);
       color:var(--txt); font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
       padding:14px; padding-bottom:40px; max-width:520px; margin:0 auto}
  .logo{display:block; width:78%; max-width:320px; margin:6px auto 2px;
        filter:drop-shadow(0 0 14px rgba(237,28,36,.45))}
  .tag{text-align:center; color:var(--mut); font-size:12px; letter-spacing:3px;
       text-transform:uppercase; margin-bottom:14px}
  .status{display:flex; align-items:center; gap:10px; background:var(--card);
          border:1px solid #20242a; border-radius:14px; padding:12px 14px; margin-bottom:8px}
  .dot{width:11px;height:11px;border-radius:50%;background:var(--off);box-shadow:0 0 10px var(--off)}
  .dot.on{background:var(--ok);box-shadow:0 0 10px var(--ok)}
  .status .st{font-weight:700}
  .status .ls{color:var(--mut); font-size:12px; margin-left:auto}
  .sec{font-size:12px; text-transform:uppercase; letter-spacing:2px; color:#c43b40;
       margin:18px 4px 9px; font-weight:700}
  .grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px}
  .grid.two{grid-template-columns:1fr 1fr}
  button.b{appearance:none; border:1px solid #23272d; background:linear-gradient(180deg,#17191d,#101114);
           color:var(--txt); border-radius:15px; padding:15px 6px; font-size:14px; font-weight:600;
           cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:7px;
           transition:.1s; min-height:84px}
  button.b:active{transform:scale(.96)}
  button.b.red{background:linear-gradient(180deg,#2a0c0f,#16100f); border-color:#5a1d20}
  button.b.red:active{border-color:var(--red)}
  .ic{width:28px;height:28px;color:var(--red2)}
  button.b .ic{filter:drop-shadow(0 0 6px rgba(255,59,67,.35))}
  .wfill{color:var(--red2)}
  .loc{background:var(--card); border:1px solid #20242a; border-radius:14px; padding:14px; margin-top:10px}
  .loc .coord{font-size:14px; color:var(--mut)}
  .loc a{color:var(--red2); text-decoration:none; font-weight:700; margin-right:16px}
  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
         background:#120305; border:1px solid var(--red); color:#fff; padding:10px 18px; border-radius:30px;
         font-size:14px; opacity:0; transition:.2s; pointer-events:none; z-index:9;
         box-shadow:0 0 20px rgba(237,28,36,.3)}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  .cfg{margin-top:24px; border-top:1px solid #20242a; padding-top:14px}
  .cfg summary{color:var(--mut); cursor:pointer; font-size:13px}
  .cfg input{width:100%; background:var(--card2); border:1px solid #23272d; color:#fff;
             border-radius:10px; padding:11px; margin-top:8px; font-size:14px}
  .cfg .save{margin-top:10px; width:100%; background:var(--red); border:none; color:#fff;
             padding:12px; border-radius:10px; font-weight:700; cursor:pointer}
</style>
</head>

<script>
  const $ = s => document.querySelector(s);
  let CAR = localStorage.getItem('car') || 'deepal1';
  let KEY = localStorage.getItem('key') || '';
  $('#car').value = CAR; $('#key').value = KEY;

  function saveCfg(){
    CAR = $('#car').value.trim() || 'deepal1';
    KEY = $('#key').value.trim();
    localStorage.setItem('car', CAR); localStorage.setItem('key', KEY);
    toast('Сохранено'); poll();
  }
  function toast(t){ const e=$('#toast'); e.textContent=t; e.classList.add('show');
    clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('show'),1600); }

  async function cmd(action){
    if(!KEY){ toast('Задай ключ в настройках'); return; }
    try{
      const r = await fetch('/api/cmd',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({key:KEY,car:CAR,action})});
      toast(r.ok ? 'Команда отправлена ✓' : 'Ошибка отправки');
    }catch(e){ toast('Нет связи с сервером'); }
  }

  function ago(ts){ if(!ts) return ''; const s=Math.floor((Date.now()-ts)/1000);
    if(s<60) return s+' сек назад'; if(s<3600) return Math.floor(s/60)+' мин назад';
    return Math.floor(s/3600)+' ч назад'; }

  async function poll(){
    if(!KEY){ $('#st').textContent='Задайте ключ в настройках'; return; }
    try{
      const r = await fetch('/api/state?key='+encodeURIComponent(KEY)+'&car='+encodeURIComponent(CAR));
      if(!r.ok){ $('#st').textContent='Ключ не подходит'; $('#dot').className='dot'; return; }
      const s = await r.json();
      $('#dot').className = 'dot' + (s.online?' on':'');
      $('#st').textContent = s.online ? 'Магнитола на связи' : 'Не в сети';
      $('#ls').textContent = s.lastSeen ? ago(s.lastSeen) : '';
      if(s.location){
        const {lat,lon} = s.location;
        $('#locBox').style.display='block';
        $('#coord').textContent = lat.toFixed(5)+', '+lon.toFixed(5)+'  ('+ago(s.location.t)+')';
        $('#ya').href='https://yandex.ru/maps/?pt='+lon+','+lat+'&z=16&l=map';
        $('#gg').href='https://maps.google.com/?q='+lat+','+lon;
      }
    }catch(e){ $('#st').textContent='Нет связи с сервером'; $('#dot').className='dot'; }
  }
  poll(); setInterval(poll, 3000);
</script>
</body>
</html>
